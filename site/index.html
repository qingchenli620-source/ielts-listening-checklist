<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe6">
  <title>雅思听力词汇勾选表</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23b6402a' stroke-width='4'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='30' font-family='serif' fill='%23b6402a'%3E%E8%AF%8D%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot" class="boot">正在打开…</div>

  <div id="login" class="login-wrap" hidden>
    <section class="card">
      <div class="brand">
        <span class="seal" aria-hidden="true">词</span>
        <div>
          <h1>雅思听力词汇勾选表</h1>
          <p class="lead">登录后可以勾选单词、跳到视频里的原句，并在手机和电脑上同步。</p>
        </div>
      </div>
      <p id="config-problems" class="warn" hidden></p>
      <form id="login-form">
        <label>邮箱
          <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required>
        </label>
        <label>密码
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button id="login-submit" class="primary" type="submit">登录</button>
      </form>
      <div class="purchase">
        <h2>如何获得账号</h2>
        <p id="purchase-note"></p>
      </div>
    </section>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="wrap top-row">
        <div class="brand compact">
          <span class="seal" aria-hidden="true">词</span>
          <div>
            <h1>雅思听力词汇</h1>
            <p class="lead">勾选、跳转、多设备同步</p>
          </div>
        </div>
        <div class="account">
          <span id="who"></span>
          <button type="button" id="open-password" class="texty">修改密码</button>
          <button type="button" id="logout" class="texty">退出</button>
        </div>
      </div>
      <div class="wrap toolbar">
        <input id="search" type="search" placeholder="搜索英文单词" aria-label="搜索英文单词" autocomplete="off" enterkeyhint="search">
        <select id="video" aria-label="选择视频"></select>
        <div class="tools">
          <label class="check"><input id="only" type="checkbox"> 只看已勾选</label>
          <div class="font">
            <span>字号</span>
            <button type="button" id="font-down" aria-label="减小字号">A−</button>
            <span id="font-label">18</span>
            <button type="button" id="font-up" aria-label="增大字号">A+</button>
          </div>
          <span id="global-count">已勾选 0 / 0</span>
          <span id="sync" data-mode="ok">已同步</span>
        </div>
        <div class="tools">
          <button type="button" id="export-words">导出单词</button>
          <button type="button" id="export-detail">导出单词和时间</button>
          <button type="button" id="refresh">刷新</button>
          <button type="button" id="clear-open" class="danger">清空勾选</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <p id="loading">正在读取词表…</p>
      <p id="load-error" class="warn" hidden></p>
      <section id="export-panel" class="export-panel" hidden>
        <div class="export-head">
          <h2>已勾选的单词</h2>
          <button type="button" id="export-close" class="texty">关闭</button>
        </div>
        <p id="export-meta"></p>
        <textarea id="export-text" readonly></textarea>
        <button type="button" id="export-copy" class="primary">复制</button>
      </section>
      <p id="empty" hidden>没有符合条件的单词</p>
      <div id="list"></div>
      <p id="footer-stats" class="foot"></p>
    </main>
  </div>

  <div id="modal" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="clear-title">
      <h2 id="clear-title">清空所有勾选？</h2>
      <p>这个账号在所有设备上的勾选都会删除，而且不能恢复。</p>
      <div class="dialog-actions">
        <button type="button" id="modal-cancel">取消</button>
        <button type="button" id="modal-confirm" class="danger">确认清空</button>
      </div>
    </div>
  </div>

  <div id="password-modal" class="overlay" hidden>
    <form class="dialog" id="password-form" role="dialog" aria-modal="true" aria-labelledby="password-title">
      <h2 id="password-title">修改密码</h2>
      <p id="password-lead">设置一个新密码。至少 6 位。</p>
      <label>新密码
        <input id="new-password" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <label>再输入一次
        <input id="new-password-2" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <p id="password-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="password-cancel">取消</button>
        <button type="submit" id="password-save" class="primary">保存</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="boot">请启用浏览器的 JavaScript 后再使用。</p></noscript>
  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
